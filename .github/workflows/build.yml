name: Build and publish a Docker images

on:
  push:
    branches: ['master']
  schedule:
    - cron: '0 0 * * 0'
    # hourly: rebuild only when an upstream base image digest changed (security patches)
    - cron: '17 * * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.digests.outputs.key }}
      changed: ${{ steps.cache.outputs.cache-hit != 'true' }}
    steps:
      - name: Resolve base image digests
        id: digests
        run: |
          for v in 8.3 8.4 8.5; do
            for img in php:$v-fpm-alpine dunglas/frankenphp:php$v; do
              docker buildx imagetools inspect "$img" --format '{{.Manifest.Digest}}'
            done
          done | tee digests.txt
          echo "key=base-images-$(sha256sum digests.txt | cut -c1-64)" >> "$GITHUB_OUTPUT"

      # ponytail: GHA cache as state store; if the entry gets evicted we just rebuild once more
      - name: Check if these digests were already built
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: digests.txt
          key: ${{ steps.digests.outputs.key }}
          lookup-only: true

  build-and-push-image:
    needs: check
    if: ${{ !cancelled() && (github.event.schedule != '17 * * * *' || (needs.check.result == 'success' && needs.check.outputs.changed == 'true')) }}
    name: Build ${{ matrix.image }}:${{ matrix.version }}${{ matrix.with-grpc == '1' && '-with-grpc' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image:
          - php-fpm
          - frankenphp
        version:
          - 8.3
          - 8.4
          - 8.5
        with-grpc:
          - 0
          - 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            WITH_GRPC=${{ matrix.with-grpc }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ matrix.version }}${{ matrix.with-grpc == '1' && '-with-grpc' || '' }}
          platforms: linux/arm64,linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  save-digests:
    needs: [check, build-and-push-image]
    if: ${{ needs.check.result == 'success' && needs.check.outputs.changed == 'true' && needs.build-and-push-image.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.check.outputs.key }}" > digests.txt
      - uses: actions/cache/save@v4
        with:
          path: digests.txt
          key: ${{ needs.check.outputs.key }}
