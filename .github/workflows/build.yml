name: Build and publish a Docker images

on:
  push:
    branches: ['master']
  schedule:
    - cron: '0 0 * * 0'
    # hourly: rebuild only when an upstream base image digest changed (security patches)
    - cron: '17 * * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      key: ${{ steps.digests.outputs.key }}
      changed: ${{ steps.cache.outputs.cache-hit != 'true' }}
      busy: ${{ steps.busy.outputs.count != '0' }}
    steps:
      # without this the hourly check would start a rebuild over a running one and cancel it
      - name: Count other unfinished runs of this workflow
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml -L 50 --json databaseId,status \
            --jq 'map(select(.status != "completed" and .databaseId != ${{ github.run_id }})) | length')
          echo "count=$count" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve base image digests
        id: digests
        run: |
          for v in 8.3 8.4 8.5; do
            for img in php:$v-fpm-alpine dunglas/frankenphp:php$v; do
              docker buildx imagetools inspect "$img" --format '{{.Manifest.Digest}}'
            done
          done | tee digests.txt
          echo "key=base-images-$(sha256sum digests.txt | cut -c1-64)" >> "$GITHUB_OUTPUT"

      # ponytail: GHA cache as state store; if the entry gets evicted we just rebuild once more
      - name: Check if these digests were already built
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: digests.txt
          key: ${{ steps.digests.outputs.key }}
          lookup-only: true

  build:
    needs: check
    if: ${{ !cancelled() && (github.event.schedule != '17 * * * *' || (needs.check.result == 'success' && needs.check.outputs.changed == 'true' && needs.check.outputs.busy == 'false')) }}
    # a newer build of the same image cancels an older one, so a stale build never reaches the merge step
    concurrency:
      group: build-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.with-grpc }}-${{ matrix.platform.arch }}
      cancel-in-progress: true
    name: Build ${{ matrix.image }}:${{ matrix.version }}${{ matrix.with-grpc == '1' && '-with-grpc' || '' }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - php-fpm
          - frankenphp
        version:
          - 8.3
          - 8.4
          - 8.5
        with-grpc:
          - 0
          - 1
        # native runners per arch: no QEMU emulation
        platform:
          - { arch: amd64, name: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, name: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: ${{ matrix.platform.name }}
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            WITH_GRPC=${{ matrix.with-grpc }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.version }}-${{ matrix.with-grpc }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.version }}-${{ matrix.with-grpc }}-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.with-grpc }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    # runs per tag even if another image failed; a tag missing an arch fails below and keeps its old image
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    concurrency:
      group: merge-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.with-grpc }}
      cancel-in-progress: true
    name: Publish ${{ matrix.image }}:${{ matrix.version }}${{ matrix.with-grpc == '1' && '-with-grpc' || '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - php-fpm
          - frankenphp
        version:
          - 8.3
          - 8.4
          - 8.5
        with-grpc:
          - 0
          - 1
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.with-grpc }}-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tag
        working-directory: /tmp/digests
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}"
          tag="$image:${{ matrix.version }}${{ matrix.with-grpc == '1' && '-with-grpc' || '' }}"
          refs=()
          for d in *; do refs+=("$image@sha256:$d"); done
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "::error::expected 2 arch digests for $tag, got ${#refs[@]}; not publishing"
            exit 1
          fi
          docker buildx imagetools create -t "$tag" "${refs[@]}"
          docker buildx imagetools inspect "$tag"

  save-digests:
    needs: [check, merge]
    if: ${{ needs.check.result == 'success' && needs.check.outputs.changed == 'true' && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.check.outputs.key }}" > digests.txt
      - uses: actions/cache/save@v4
        with:
          path: digests.txt
          key: ${{ needs.check.outputs.key }}
